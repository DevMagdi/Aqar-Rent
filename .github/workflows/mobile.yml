name: Mobile quality & release builds

on:
  push:
    branches: [main, "arena/**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml", "scripts/mobile-build.sh"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml", "scripts/mobile-build.sh"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap native shells (generates Gradle wrapper / Xcode project)
        working-directory: mobile
        run: flutter create . --org com.aqarrent --platforms android,ios --project-name aqar_rent_mobile
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: SDK-free static checks (syntax, imports, i18n, routes, API paths)
        run: |
          python -m pip install --quiet tree-sitter tree_sitter_dart
          python scripts/check_mobile.py
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze --fatal-infos
      - name: Unit + widget tests
        working-directory: mobile
        run: flutter test --coverage
      - name: Android release APK + App Bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BASE: ${{ secrets.API_BASE }}
          MAP_TILES_URL: ${{ secrets.MAP_TILES_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES" > mobile/android/key.properties
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          ./scripts/mobile-build.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-release
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          flutter create . --org com.aqarrent --platforms ios --project-name aqar_rent_mobile
          flutter pub get
      - name: CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update
      - name: iOS release IPA
        env:
          API_BASE: ${{ secrets.API_BASE }}
          MAP_TILES_URL: ${{ secrets.MAP_TILES_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > mobile/ios/Runner/GoogleService-Info.plist
          ./scripts/mobile-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: mobile/build/ios/ipa/*.ipa
