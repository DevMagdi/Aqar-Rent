name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt pip-audit
      - name: pip-audit (backend requirements)
        run: pip-audit -r backend/requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: mypy (mypy-lite)
        working-directory: backend
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar
          POSTGRES_DB: aqar
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aqar -d aqar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests (SQLite — fast default)
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing 2>&1 | tee ../pytest-sqlite.log
      - name: Upload pytest log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-sqlite-log
          path: pytest-sqlite.log
          if-no-files-found: ignore

      - name: Migrate PostgreSQL + run tests (validates PostGIS path)
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aqar:aqar@localhost:5432/aqar
          TEST_DATABASE_URL: postgresql+psycopg://aqar:aqar@localhost:5432/aqar
        run: |
          set -o pipefail
          alembic upgrade head 2>&1 | tee ../alembic-pg.log
          python -m pytest -q 2>&1 | tee ../pytest-pg.log
      - name: Upload pytest log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-pg-log
          path: |
            pytest-pg.log
            alembic-pg.log
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        env:
          BACKEND_URL: http://localhost:8000
        run: npx next build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        working-directory: admin
        run: npm ci --no-audit --no-fund
      - name: npm audit
        working-directory: admin
        run: npm audit --audit-level=high
      - name: Typecheck + build
        working-directory: admin
        run: |
          npx tsc --noEmit
          npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend + e2e deps
        run: |
          pip install -r backend/requirements-dev.txt
          cd e2e && npm ci --no-audit --no-fund
      - name: Playwright owner journey + contracts
        working-directory: e2e
        env:
          E2E_PYTHON: python
        run: npx playwright test --reporter=line 2>&1 | tee ../playwright-e2e.log
      - name: Upload e2e artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            playwright-e2e.log
            e2e/test-results/
          if-no-files-found: ignore
