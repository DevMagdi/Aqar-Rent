name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: mypy (mypy-lite)
        working-directory: backend
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar
          POSTGRES_DB: aqar
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aqar -d aqar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests (SQLite — fast default)
        if: matrix.database == 'sqlite'
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing

      - name: Migrate PostgreSQL + run tests (validates PostGIS path)
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aqar:aqar@localhost:5432/aqar
          TEST_DATABASE_URL: postgresql+psycopg://aqar:aqar@localhost:5432/aqar
        run: |
          alembic upgrade head
          python -m pytest -q
