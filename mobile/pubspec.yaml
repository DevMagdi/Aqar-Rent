name: aqar_rent_mobile
description: "Aqar Rent (عقار رينت) — Arabic-first, production Flutter client for Egypt's trusted rental platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking / secure storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.1

  # Navigation & platform
  go_router: ^14.8.1
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  package_info_plus: ^8.1.1

  # Media, maps, image caching/compression
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.1.0
  image_picker: ^1.1.2
  maplibre_gl: ^0.20.0

  # Push notifications (real FCM; no mock path in production)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.3
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#0F1C2E"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 23
