# Staging/production stack (Phase 4C #9).
#   cp .env.staging.example .env.staging   # fill every required secret
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# Layers of protection:
#  1) `${VAR:?}` below refuses to even start the stack with missing secrets;
#  2) the API refuses to boot (SystemExit) with unsafe APP_ENV=prod config —
#     weak SECRET_KEY, DEBUG=true, SQLite, console OTP, mock payments in prod,
#     wildcard CORS … (app/core/config.py::validate_runtime);
#  3) healthchecks + restart policies + log rotation + resource limits.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-aqar}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqar} -d ${POSTGRES_DB:-aqar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 2
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.staging}
    volumes:
      - minio_staging:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-aqar} $${MINIO_ROOT_PASSWORD:?required} &&
      mc mb -p local/$${S3_BUCKET_MEDIA:-aqar-media} || true &&
      mc mb -p local/$${S3_BUCKET_DOCUMENTS:-aqar-documents} || true &&
      mc anonymous set download local/$${S3_BUCKET_MEDIA:-aqar-media} || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-aqar-media}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-aqar-documents}
    restart: "no"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (postgresql+psycopg://…)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1
    logging: *default-logging

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (postgresql+psycopg://…)}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    command: arq app.worker.WorkerSettings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL (https://…)}
        NEXT_PUBLIC_MAP_TILES_URL: ${MAP_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ar').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *default-logging

volumes:
  pgdata_staging:
  minio_staging:
